<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMOS AI - المساعد الذكي</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }
        .header {
            text-align: center;
            padding: 15px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            color: #58a6ff;
            font-weight: bold;
            font-size: 20px;
        }
        .chat-container { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .message { 
            padding: 12px 18px; 
            border-radius: 12px; 
            max-width: 75%; 
            line-height: 1.6;
        }
        .user-message { 
            background-color: #21262d; 
            align-self: flex-start; 
            border: 1px solid #30363d;
        }
        .bot-message { 
            background-color: #0b2942; 
            align-self: flex-end; 
            border: 1px solid #1f6feb;
        }
        .input-area { 
            padding: 15px; 
            background-color: #161b22; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #30363d;
        }
        input[type="text"] { 
            flex-grow: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #30363d; 
            background-color: #0d1117; 
            color: white; 
            outline: none;
        }
        button { 
            padding: 12px 24px; 
            border-radius: 8px; 
            border: none; 
            background-color: #238636; 
            color: white; 
            font-weight: bold;
            cursor: pointer; 
        }
        button:hover { background-color: #2ea043; }
        .loading { font-size: 13px; color: #58a6ff; align-self: flex-end; display: none; margin-top: -5px; }
    </style>
</head>
<body>

    <div class="header">HOMOS AI</div>

    <div class="chat-container" id="chat-container">
        <div class="message bot-message">أهلاً بك! أنا HOMOS AI، المساعد الذكي الخاص بك. هل تبحث عن شيء معين في المول الذكي اليوم؟ اسألني عن أي معلومات وسأجيبك.</div>
    </div>
    
    <div class="loading" id="loading-indicator">جاري البحث عن الإجابة...</div>

    <div class="input-area">
        <button onclick="sendMessage()">إرسال</button>
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." onkeypress="handleKeyPress(event)">
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const loadingIndicator = document.getElementById('loading-indicator');

        // الذاكرة المحلية للردود السريعة والمباشرة (تقدر تعدل فيها زي ما تحب)
        const localBrain = {
            "اهلا": "أهلاً بك! كيف يمكنني مساعدتك اليوم؟",
            "أهلا": "أهلاً بك! كيف يمكنني مساعدتك اليوم؟",
            "السلام عليكم": "وعليكم السلام ورحمة الله وبركاته. تفضل، أنا جاهز لخدمتك.",
            "انت مين": "أنا HOMOS AI، مساعد افتراضي تم تصميمي لمساعدتك والإجابة على أسئلتك.",
            "أنت مين": "أنا HOMOS AI، مساعد افتراضي تم تصميمي لمساعدتك والإجابة على أسئلتك.",
            "اسمك ايه": "اسمي HOMOS AI.",
            "ازيك": "أنا بخير، شكراً لسؤالك! كيف أستطيع مساعدتك في تصفح خدماتنا؟"
        };

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            let text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';
            loadingIndicator.style.display = 'block';

            // البحث في الذاكرة المحلية أولاً
            let foundLocal = false;
            for (const [key, response] of Object.entries(localBrain)) {
                if (text.includes(key)) {
                    setTimeout(() => {
                        appendMessage(response, 'bot-message');
                        loadingIndicator.style.display = 'none';
                    }, 600); // تأخير بسيط لجعله يبدو واقعياً
                    foundLocal = true;
                    break;
                }
            }

            // إذا لم يكن السؤال محادثة عادية، نبحث في قاعدة البيانات (ويكيبيديا المفتوحة)
            if (!foundLocal) {
                try {
                    // استدعاء ويكيبيديا بدون أي مفاتيح، origin=* تمنع أي أخطاء من المتصفح
                    const apiUrl = `https://ar.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=1&explaintext=1&redirects=1&origin=*&titles=${encodeURIComponent(text)}`;
                    
                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    const pages = data.query.pages;
                    const pageId = Object.keys(pages)[0];

                    if (pageId === "-1") {
                        appendMessage("عذراً، لم أتمكن من العثور على معلومات محددة حول هذا الموضوع. هل يمكنك كتابة السؤال بشكل مختلف؟", 'bot-message');
                    } else {
                        // أخذ أول 300 حرف من الإجابة حتى لا تكون طويلة جداً
                        let extract = pages[pageId].extract;
                        if(extract.length > 350) {
                            extract = extract.substring(0, 350) + "...";
                        }
                        appendMessage(extract, 'bot-message');
                    }
                } catch (error) {
                    appendMessage("حدث خطأ في جلب البيانات، يرجى المحاولة مرة أخرى.", 'bot-message');
                } finally {
                    loadingIndicator.style.display = 'none';
                }
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
