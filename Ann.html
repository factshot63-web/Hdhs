<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMOS AI - سهل وسريع</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">
    
    <header class="p-4 bg-slate-900 border-b border-slate-800 font-bold text-cyan-400 text-lg">
        HOMOS AI (نسخة بسيطة وشغالة)
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
        <div class="p-3 bg-cyan-950 border border-cyan-800 rounded-lg max-w-[80%] text-white">
            أهلاً بك! اكتب رسالتك وسأقوم بالرد عليك فوراً.
        </div>
    </main>

    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 bg-slate-800 rounded-lg p-3 outline-none text-white" placeholder="اكتب رسالتك هنا...">
            <button onclick="sendMsg()" class="bg-cyan-600 hover:bg-cyan-700 px-6 py-2 rounded-lg font-bold transition">إرسال</button>
        </div>
    </footer>

    <script>
        async function sendMsg() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="p-3 bg-slate-700 rounded-lg max-w-[80%] ml-auto text-white">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                // استخدام خدمة بديلة مجانية وسريعة للاختبار
                const res = await fetch(`https://kaas.onrender.com/chat?q=${encodeURIComponent(text)}`);
                const data = await res.json();
                
                const reply = data.reply || "عفواً، حدث خطأ بسيط.";
                container.innerHTML += `<div class="p-3 bg-cyan-950 border border-cyan-800 rounded-lg max-w-[80%] text-white">${reply}</div>`;
            } catch(e) {
                // رد احتياطي محلي لضمان أن التطبيق لن يتوقف أبداً
                container.innerHTML += `<div class="p-3 bg-cyan-950 border border-cyan-800 rounded-lg max-w-[80%] text-white">أهلاً بك! لقد استلمت رسالتك: "${text}" (هذا رد تجريبي لضمان عمل الصفحة بسلاسة).</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
