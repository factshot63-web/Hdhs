<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMOS AI - شات الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-cyan-500/20">
                H
            </div>
            <div>
                <h1 class="font-bold text-lg text-cyan-400">HOMOS AI</h1>
                <div class="flex items-center space-x-1.5 space-x-reverse text-xs text-slate-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>متصل وجاهز للمساعدة</span>
                </div>
            </div>
        </div>
        <button onclick="clearChat()" class="text-slate-400 hover:text-red-400 transition text-sm flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-lg">
            <i class="fa-solid fa-trash-can"></i> مسح المحادثة
        </button>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-3 space-x-reverse">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-sm shrink-0">H</div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 max-w-[80%] shadow-md leading-relaxed">
                أهلاً بك! أنا <b>HOMOS AI</b>، مساعدك الذكي. كيف يمكنني مساعدتك في مشروعك أو أسئلتك اليوم؟
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 shadow-lg">
        <form id="chat-form" onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autocomplete="off"
                class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 text-slate-100 placeholder-slate-500 transition">
            <button type="submit" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-3 space-x-reverse ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const avatar = isUser 
                ? '<div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-white text-sm shrink-0"><i class="fa-solid fa-user"></i></div>'
                : '<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-sm shrink-0">H</div>';

            const bubbleClass = isUser 
                ? 'bg-cyan-600 text-white rounded-2xl p-4 max-w-[80%] shadow-md leading-relaxed' 
                : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-2xl p-4 max-w-[80%] shadow-md leading-relaxed';

            messageDiv.innerHTML = `
                ${avatar}
                <div class="${bubbleClass}">${escapeHtml(text)}</div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex items-start space-x-3 space-x-reverse';
            typingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-sm shrink-0">H</div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-slate-400 flex items-center space-x-2 space-x-reverse">
                    <span class="w-2 h-2 bg-cyan-500 rounded-full animate-bounce"></span>
                    <span class="w-2 h-2 bg-cyan-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                    <span class="w-2 h-2 bg-cyan-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const typingDiv = document.getElementById('typing-indicator');
            if (typingDiv) typingDiv.remove();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            showTyping();

            // محاكاة رد ذكي فوري (يمكنك ربطه بأي API خارجي لاحقاً)
            setTimeout(() => {
                removeTyping();
                let response = getHomosResponse(text);
                appendMessage(response, 'bot');
            }, 1000);
        }

        function getHomosResponse(query) {
            query = query.toLowerCase();
            if (query.includes('مرحبا') || query.includes('السلام') || query.includes('اهلاً')) {
                return 'أهلاً بك! أنا HOMOS AI، كيف يمكنني مساعدتك اليوم؟';
            } else if (query.includes('اسمك') || query.includes('من أنت')) {
                return 'أنا HOMOS AI، نظام ذكاء اصطناعي مصمم لتلبية احتياجاتك وتطوير تطبيقاتك بسرعة.';
            } else if (query.includes('مشروع') || query.includes('تطبيق')) {
                return 'رائع! بناء وتطوير الويب هو اختصاصي. هل تريد إضافة ميزات جديدة مثل الألعاب أو غرف الدردشة؟';
            } else {
                return `لقد استلمت رسالتك: "${query}". أنا جاهز لتنفيذ أي فكرة أو كود برمجي تريده فوراً!`;
            }
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3 space-x-reverse">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-sm shrink-0">H</div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 max-w-[80%] shadow-md leading-relaxed">
                        تم مسح المحادثة. كيف يمكنني مساعدتك الآن؟
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
