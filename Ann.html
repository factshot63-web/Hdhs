<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMOS AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">
    
    <header class="p-4 bg-slate-900 border-b border-slate-800 font-bold text-cyan-400 text-lg">
        HOMOS AI
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full"></main>

    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 bg-slate-800 rounded-lg p-3 outline-none text-white" placeholder="اكتب رسالتك هنا...">
            <button onclick="send()" class="bg-cyan-600 hover:bg-cyan-700 px-6 py-2 rounded-lg font-bold transition">إرسال</button>
        </div>
    </footer>

    <script>
        // ضع مفتاحك الجديد الذي يبدأ بـ AQ. هنا بين علامتي التنصيص
        const API_KEY = "AQ.Ab8RN6K_n7ssGf8AHStuXczIZ6Jd93-8608Q0Za8f3L1FypkBw";

        async function send() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if(!msg) return;
            
            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="p-3 bg-slate-700 rounded-lg max-w-[80%] ml-auto text-white">${msg}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                // استخدام نموذج gemini-2.0-flash المتوافق تماماً مع المفاتيح الجديدة
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: msg }] }] })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    container.innerHTML += `<div class="p-3 bg-cyan-950 border border-cyan-800 rounded-lg max-w-[80%] text-white">${reply}</div>`;
                } else {
                    console.error(data);
                    container.innerHTML += `<div class="p-3 bg-red-950 border border-red-800 rounded-lg max-w-[80%] text-red-200">خطأ من الخادم، تأكد من تفعيل المشروع.</div>`;
                }
            } catch (err) {
                container.innerHTML += `<div class="p-3 bg-red-950 border border-red-800 rounded-lg max-w-[80%] text-red-200">فشل الاتصال.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
