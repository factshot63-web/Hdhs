<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>HOMOS AI - متصل</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">
    
    <!-- منطقة الشات -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4"></main>

    <!-- منطقة الإدخال -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 bg-slate-800 rounded-lg p-3 outline-none" placeholder="اكتب سؤالك...">
            <button onclick="send()" class="bg-cyan-600 px-6 py-2 rounded-lg">إرسال</button>
        </div>
    </footer>

    <script>
        // ضع مفتاحك الجديد هنا بين علامتي التنصيص
        const API_KEY = "YOUR_NEW_API_KEY_HERE"; 

        async function send() {
            const input = document.getElementById('user-input');
            const msg = input.value;
            if(!msg) return;
            
            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="p-3 bg-slate-700 rounded-lg self-end">${msg}</div>`;
            input.value = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: msg }] }] })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                container.innerHTML += `<div class="p-3 bg-cyan-900 rounded-lg">${reply}</div>`;
            } catch (err) {
                container.innerHTML += `<div class="p-3 bg-red-900 rounded-lg">خطأ: تأكد من مفتاح الـ API</div>`;
            }
        }
    </script>
</body>
</html>
