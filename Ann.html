<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMOS AI - المساعد الذكي</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }
        .header {
            text-align: center;
            padding: 15px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            color: #58a6ff;
            font-weight: bold;
            font-size: 20px;
        }
        .chat-container { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            scroll-behavior: smooth;
        }
        .message { 
            padding: 12px 18px; 
            border-radius: 12px; 
            max-width: 80%; 
            line-height: 1.6;
            word-wrap: break-word;
        }
        .user-message { 
            background-color: #21262d; 
            align-self: flex-start; 
            border: 1px solid #30363d;
            color: white;
        }
        .bot-message { 
            background-color: #0b2942; 
            align-self: flex-end; 
            border: 1px solid #1f6feb;
            color: #c9d1d9;
        }
        .error-message {
            background-color: #3b1318;
            align-self: flex-end;
            border: 1px solid #ff7b72;
            color: #ff7b72;
        }
        .input-area { 
            padding: 15px; 
            background-color: #161b22; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #30363d;
        }
        input[type="text"] { 
            flex-grow: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #30363d; 
            background-color: #0d1117; 
            color: white; 
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button { 
            padding: 12px 24px; 
            border-radius: 8px; 
            border: none; 
            background-color: #238636; 
            color: white; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { background-color: #2ea043; }
        .loading-container {
            align-self: flex-end;
            display: none;
            color: #58a6ff;
            font-size: 13px;
            margin-top: -5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header">HOMOS AI</div>

    <div class="chat-container" id="chat-container">
        <div class="message bot-message">أهلاً بك! أنا HOMOS AI، المساعد الذكي. اسألني في أي شيء وسأجيبك فوراً!</div>
    </div>
    
    <div class="loading-container" id="loading-indicator">جاري معالجة الطلب...</div>

    <div class="input-area">
        <button onclick="sendMessage()" id="send-btn">إرسال</button>
        <input type="text" id="user-input" placeholder="اكتب سؤالك لـ HOMOS AI هنا..." onkeypress="handleKeyPress(event)">
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const loadingIndicator = document.getElementById('loading-indicator');
        const sendBtn = document.getElementById('send-btn');

        // دالة المترجم المخفي (Google Translate API المجانية)
        async function translateText(text, fromLang, toLang) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            let translated = "";
            // تجميع النص المترجم في حال كان طويلاً ومقسماً
            data[0].forEach(item => {
                if(item[0]) translated += item[0];
            });
            return translated;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            let text = userInput.value.trim();
            if (!text) return;

            // إظهار رسالة المستخدم
            appendMessage(text, 'user-message');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            loadingIndicator.style.display = 'block';

            try {
                // 1. ترجمة السؤال من العربي للإنجليزي (عشان الذكاء الاصطناعي يفهمه أسرع وبدون مشاكل شبكة)
                loadingIndicator.textContent = "جاري الترجمة...";
                const englishQuestion = await translateText(text, 'ar', 'en');

                // 2. إرسال السؤال الإنجليزي للذكاء الاصطناعي
                loadingIndicator.textContent = "HOMOS AI يفكر...";
                const systemPrompt = "You are a highly intelligent and helpful AI assistant named HOMOS AI. Reply in a concise and friendly manner.";
                
                // استخدام خدمة مجانية تماماً ولا تحتاج مفاتيح
                const aiUrl = `https://text.pollinations.ai/${encodeURIComponent(englishQuestion)}?system=${encodeURIComponent(systemPrompt)}`;
                const aiResponse = await fetch(aiUrl);
                
                if (!aiResponse.ok) throw new Error("AI Service down");
                const englishAnswer = await aiResponse.text();

                // 3. ترجمة إجابة الذكاء الاصطناعي من الإنجليزي للعربي
                loadingIndicator.textContent = "جاري صياغة الرد بالعربية...";
                const arabicAnswer = await translateText(englishAnswer, 'en', 'ar');

                // إظهار الرد النهائي بالعربي
                appendMessage(arabicAnswer, 'bot-message');

            } catch (error) {
                console.error(error);
                appendMessage("عذراً، حدث خطأ مؤقت. يرجى المحاولة مرة أخرى.", 'error-message');
            } finally {
                loadingIndicator.style.display = 'none';
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            // الحفاظ على الأسطر الجديدة في النص
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
